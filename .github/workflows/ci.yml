name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main
      - develop
      - feature/**

permissions:
  contents: read
  packages: write

jobs:
  # =========================
  # LINT (on garde)
  # =========================
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Lint backend
        run: |
          cd backend
          npm run lint

  # =========================
  # DOCKER BUILD (TP 2.1)
  # =========================
  docker-build:
    name: Docker build images
    runs-on: self-hosted
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      - name: Build backend Docker image
        run: docker build -t backend:ci-build ./backend

      - name: Build frontend Docker image
        run: docker build -t frontend:ci-build ./frontend

  # =========================
  # BUILD NODE (OBSOLETE)
  # Le build est maintenant fait
  # dans les Dockerfiles multi-stage
  # =========================
  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build backend
        run: |
          cd backend
          npm run build

  # =========================
  # TESTS NODE (OBSOLETE)
  # Remplaces par des smoke tests
  # Docker (TP 2.2)
  # =========================
  tests:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test

  # =========================
  # PUBLISH GHCR (TP 2.3)
  # =========================
  publish:
    name: Publish images to GHCR
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        shell: powershell
        run: |
          $repo = "${{ github.event.repository.name }}".ToLower()
          $owner = "${{ github.repository_owner }}".ToLower()
          "IMAGE_BACKEND=ghcr.io/$owner/$repo-backend" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_FRONTEND=ghcr.io/$owner/$repo-frontend" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and tag images
        shell: powershell
        run: |
          docker build -t "${env:IMAGE_BACKEND}:${{ github.sha }}" ./backend
          docker build -t "${env:IMAGE_FRONTEND}:${{ github.sha }}" ./frontend
          if ("${{ github.ref_name }}" -eq "main") {
            docker tag "${env:IMAGE_BACKEND}:${{ github.sha }}" "${env:IMAGE_BACKEND}:latest"
            docker tag "${env:IMAGE_FRONTEND}:${{ github.sha }}" "${env:IMAGE_FRONTEND}:latest"
          }

      - name: Push images
        shell: powershell
        run: |
          docker push "${env:IMAGE_BACKEND}:${{ github.sha }}"
          docker push "${env:IMAGE_FRONTEND}:${{ github.sha }}"
          if ("${{ github.ref_name }}" -eq "main") {
            docker push "${env:IMAGE_BACKEND}:latest"
            docker push "${env:IMAGE_FRONTEND}:latest"
          }

  # =========================
  # DEPLOY (TP4 - CD)
  # Deploiement automatique local
  # =========================
  deploy:
    name: Deploy to local environment
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR (for pulling images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set deployment variables
        shell: powershell
        run: |
          $repo = "${{ github.event.repository.name }}".ToLower()
          $owner = "${{ github.repository_owner }}".ToLower()
          "IMAGE_BACKEND=ghcr.io/$owner/$repo-backend" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_FRONTEND=ghcr.io/$owner/$repo-frontend" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGE_TAG=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stop existing containers
        shell: powershell
        run: |
          Write-Host "Arret des conteneurs existants..."
          docker compose -f docker-compose.deploy.yaml down
          Write-Host "Conteneurs arretes."
        continue-on-error: true

      - name: Pull latest images from GHCR
        shell: powershell
        run: |
          Write-Host "Telechargement des images depuis GHCR..."
          docker pull "${env:IMAGE_BACKEND}:${env:IMAGE_TAG}"
          docker pull "${env:IMAGE_FRONTEND}:${env:IMAGE_TAG}"
          Write-Host "Images telechargees."

      - name: Create environment file
        shell: powershell
        run: |
          Write-Host "Creation du fichier .env..."
          "POSTGRES_USER=app" | Out-File -FilePath .env -Encoding utf8
          "POSTGRES_PASSWORD=supersecret" | Out-File -FilePath .env -Encoding utf8 -Append
          "POSTGRES_DB=appdb" | Out-File -FilePath .env -Encoding utf8 -Append
          Write-Host "Fichier .env cree."

      - name: Start application
        shell: powershell
        run: |
          Write-Host "Demarrage de l'application..."
          docker compose -f docker-compose.deploy.yaml up -d
          Write-Host "Application demarree."

      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "Verification du deploiement..."
          Start-Sleep -Seconds 10
          docker compose -f docker-compose.deploy.yaml ps
          Write-Host "Deploiement termine avec succes!"
