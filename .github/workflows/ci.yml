name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main
      - develop
      - feature/**

permissions:
  contents: read
  packages: write

jobs:
  # =========================
  # LINT (on garde)
  # =========================
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Lint backend
        run: |
          cd backend
          npm run lint

  # =========================
  # DOCKER BUILD (TP 2.1)
  # =========================
  docker-build:
    name: Docker build images
    runs-on: self-hosted
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      - name: Build backend Docker image
        run: docker build -t backend:ci-build ./backend

      - name: Build frontend Docker image
        run: docker build -t frontend:ci-build ./frontend

  # =========================
  # BUILD NODE (OBSOLETE)
  # Le build est maintenant fait
  # dans les Dockerfiles multi-stage
  # =========================
  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build backend
        run: |
          cd backend
          npm run build

  # =========================
  # TESTS NODE (OBSOLETE)
  # Remplaces par des smoke tests
  # Docker (TP 2.2)
  # =========================
  tests:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test

  # =========================
  # PUBLISH GHCR (TP 2.3)
  # =========================
  publish:
    name: Publish images to GHCR
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        shell: bash
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/$OWNER/$REPO-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/$OWNER/$REPO-frontend" >> $GITHUB_ENV

      - name: Build and tag images
        shell: bash
        run: |
          docker build -t "$IMAGE_BACKEND:${{ github.sha }}" ./backend
          docker build -t "$IMAGE_FRONTEND:${{ github.sha }}" ./frontend
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag "$IMAGE_BACKEND:${{ github.sha }}" "$IMAGE_BACKEND:latest"
            docker tag "$IMAGE_FRONTEND:${{ github.sha }}" "$IMAGE_FRONTEND:latest"
          fi

      - name: Push images
        shell: bash
        run: |
          docker push "$IMAGE_BACKEND:${{ github.sha }}"
          docker push "$IMAGE_FRONTEND:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker push "$IMAGE_BACKEND:latest"
            docker push "$IMAGE_FRONTEND:latest"
          fi

  # =========================
  # DEPLOY (TP4 - CD)
  # Deploiement automatique local
  # =========================
  deploy:
    name: Deploy to local environment
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR (for pulling images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set deployment variables
        shell: bash
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/$OWNER/$REPO-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/$OWNER/$REPO-frontend" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Stop existing containers
        shell: bash
        run: |
          echo "Arret des conteneurs existants..."
          docker compose -f docker-compose.deploy.yaml down || true
          echo "Conteneurs arretes."

      - name: Pull latest images from GHCR
        shell: bash
        run: |
          echo "Telechargement des images depuis GHCR..."
          docker pull "$IMAGE_BACKEND:$IMAGE_TAG"
          docker pull "$IMAGE_FRONTEND:$IMAGE_TAG"
          echo "Images telechargees."

      - name: Start application
        shell: bash
        run: |
          echo "Demarrage de l'application..."
          docker compose -f docker-compose.deploy.yaml up -d
          echo "Application demarree."

      - name: Verify deployment
        shell: bash
        run: |
          echo "Verification du deploiement..."
          sleep 10
          docker compose -f docker-compose.deploy.yaml ps
          echo "Deploiement termine avec succes!"
