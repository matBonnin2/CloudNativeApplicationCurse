name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - main
      - develop
      - feature/**

permissions:
  contents: read
  packages: write

jobs:
  # =========================
  # LINT (on garde)
  # =========================
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Lint backend
        run: |
          cd backend
          npm run lint

  # =========================
  # DOCKER BUILD (TP 2.1)
  # =========================
  docker-build:
    name: Docker build images
    runs-on: self-hosted
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      - name: Build backend Docker image
        run: |
          docker build \
            -t backend:ci-build \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t frontend:ci-build \
            ./frontend

  # =========================
  # BUILD NODE (OBSOLÈTE)
  # Le build est maintenant fait
  # dans les Dockerfiles multi-stage
  # =========================
  # build:
  #   runs-on: self-hosted
  #   needs: lint
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #
  #     - name: Install frontend dependencies
  #       run: |
  #         cd frontend
  #         npm ci
  #
  #     - name: Build frontend
  #       run: |
  #         cd frontend
  #         npm run build
  #
  #     - name: Install backend dependencies
  #       run: |
  #         cd backend
  #         npm ci
  #
  #     - name: Build backend
  #       run: |
  #         cd backend
  #         npm run build

  # =========================
  # TESTS NODE (OBSOLÈTE)
  # Remplacés par des smoke tests
  # Docker (TP 2.2)
  # =========================
  # tests:
  #   runs-on: self-hosted
  #   needs: build
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #
  #     - name: Install backend dependencies
  #       run: |
  #         cd backend
  #         npm ci
  #
  #     - name: Run backend tests
  #       run: |
  #         cd backend
  #         npm test

  # =========================
  # SONARCLOUD (BONUS QUALITÉ)
  # =========================
  sonarcloud:
    runs-on: self-hosted
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install SonarScanner
        run: npm install -g sonar-scanner

      - name: Run SonarCloud scan (backend)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          sonar-scanner ^
            -Dsonar.projectKey=LargeGaultier_CloudNativeApplicationCurse ^
            -Dsonar.organization=largegaultier ^
            -Dsonar.sources=src ^
            -Dsonar.host.url=https://sonarcloud.io ^
            -Dsonar.login=%SONAR_TOKEN% ^
            -Dsonar.qualitygate.wait=true

  smoke-tests:
    name: Docker smoke tests
    runs-on: self-hosted
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start stack (CI)
        run: docker compose -f docker-compose.ci.yaml up -d

      - name: Wait for API to be ready
        shell: bash
        run: |
          set -e
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -fsS http://localhost/api/health >/dev/null; then
              echo "API is UP"
              break
            fi
            sleep 1
          done

          # Tests obligatoires du TP
          curl -fsS http://localhost/api/health
          curl -fsS http://localhost/api/whoami

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yaml down -v

  # =========================
  # PUBLISH GHCR (TP 2.3)
  # =========================
  publish:
    name: Publish images to GHCR
    runs-on: self-hosted
    needs: smoke-tests
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set image names
        shell: pwsh
        run: |
          $repo = "${{ github.event.repository.name }}".ToLower()
          "IMAGE_BACKEND=ghcr.io/${{ github.repository_owner }}/$repo-backend" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IMAGE_FRONTEND=ghcr.io/${{ github.repository_owner }}/$repo-frontend" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and tag images
        shell: pwsh
        run: |
          docker build -t "$env:IMAGE_BACKEND:${{ github.sha }}" ./backend
          docker build -t "$env:IMAGE_FRONTEND:${{ github.sha }}" ./frontend
          if ("${{ github.ref_name }}" -eq "main") {
            docker tag "$env:IMAGE_BACKEND:${{ github.sha }}" "$env:IMAGE_BACKEND:latest"
            docker tag "$env:IMAGE_FRONTEND:${{ github.sha }}" "$env:IMAGE_FRONTEND:latest"
          }

      - name: Push images
        shell: pwsh
        run: |
          docker push "$env:IMAGE_BACKEND:${{ github.sha }}"
          docker push "$env:IMAGE_FRONTEND:${{ github.sha }}"
          if ("${{ github.ref_name }}" -eq "main") {
            docker push "$env:IMAGE_BACKEND:latest"
            docker push "$env:IMAGE_FRONTEND:latest"
          }

  # =========================
  # DEPLOY BLUE/GREEN (TP5)
  # Deploiement automatique avec
  # strategie Blue/Green
  # =========================
  deploy-blue-green:
    name: Deploy Blue/Green
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set deployment variables
        shell: pwsh
        run: |
          $repo = "${{ github.event.repository.name }}".ToLower()
          $owner = "${{ github.repository_owner }}".ToLower()
          "IMAGE_BACKEND=ghcr.io/$owner/$repo-backend" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IMAGE_FRONTEND=ghcr.io/$owner/$repo-frontend" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IMAGE_TAG=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Determine active color
        shell: pwsh
        run: |
          $activeColorFile = ".active_color"
          if (Test-Path $activeColorFile) {
            $currentColor = (Get-Content $activeColorFile -Raw).Trim()
          } else {
            $currentColor = "blue"
            "blue" | Out-File -FilePath $activeColorFile -NoNewline -Encoding utf8
          }
          $targetColor = if ($currentColor -eq "blue") { "green" } else { "blue" }
          Write-Host "Couleur active: $currentColor"
          Write-Host "Couleur cible: $targetColor"
          "CURRENT_COLOR=$currentColor" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_COLOR=$targetColor" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create environment file
        shell: pwsh
        run: |
          "POSTGRES_USER=app" | Out-File -FilePath .env -Encoding utf8
          "POSTGRES_PASSWORD=supersecret" | Out-File -FilePath .env -Append
          "POSTGRES_DB=appdb" | Out-File -FilePath .env -Append

      - name: Pull new images
        shell: pwsh
        run: |
          Write-Host "Telechargement des images..."
          docker pull "$env:IMAGE_BACKEND`:$env:IMAGE_TAG"
          docker pull "$env:IMAGE_FRONTEND`:$env:IMAGE_TAG"

      - name: Start base infrastructure
        shell: pwsh
        run: |
          Write-Host "Demarrage de l'infrastructure de base..."
          $env:ACTIVE_COLOR = $env:CURRENT_COLOR
          docker compose -f docker-compose.base.yml up -d postgres
          Start-Sleep -Seconds 10

      - name: Deploy to target color
        shell: pwsh
        run: |
          Write-Host "Deploiement sur $env:TARGET_COLOR..."
          $env:ACTIVE_COLOR = $env:CURRENT_COLOR
          docker compose -f docker-compose.base.yml -f "docker-compose.$env:TARGET_COLOR.yml" up -d "backend-$env:TARGET_COLOR" "frontend-$env:TARGET_COLOR"
          Start-Sleep -Seconds 15

      - name: Switch traffic to new color
        shell: pwsh
        run: |
          Write-Host "Bascule du trafic vers $env:TARGET_COLOR..."
          $env:TARGET_COLOR | Out-File -FilePath .active_color -NoNewline -Encoding utf8
          $env:ACTIVE_COLOR = $env:TARGET_COLOR
          docker compose -f docker-compose.base.yml up -d nginx
          Start-Sleep -Seconds 3
          docker exec nginx-proxy nginx -s reload 2>$null
          Write-Host "Trafic bascule vers $env:TARGET_COLOR"

      - name: Verify deployment
        shell: pwsh
        run: |
          Write-Host "Verification du deploiement..."
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri "http://localhost/nginx-health" -UseBasicParsing
          Write-Host "Health check: $($response.Content)"
          docker compose -f docker-compose.base.yml -f docker-compose.blue.yml -f docker-compose.green.yml ps
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "  DEPLOIEMENT BLUE/GREEN TERMINE" -ForegroundColor Green
          Write-Host "  Couleur active: $env:TARGET_COLOR" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
