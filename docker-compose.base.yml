# =============================================================================
# Docker Compose - Infrastructure de base (Blue/Green Deployment)
# Contient : PostgreSQL (partage) + Nginx (reverse proxy)
# =============================================================================

services:
  # =========================
  # NGINX REVERSE PROXY
  # =========================
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      - ACTIVE_COLOR=${ACTIVE_COLOR:-blue}
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =========================
  # POSTGRESQL (PARTAGE)
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:

networks:
  app_network:
    name: bluegreen_network
    driver: bridge
